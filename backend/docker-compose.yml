services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: collector-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native (TCP) interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: collector_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: collector-service
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "2055:2055/udp"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - geoip_data:/etc/geoip
    environment:
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "collector_db"
      SAMPLING_RATE: "1000"
      MAXMIND_ASN_DB_PATH: "/etc/geoip/GeoLite2-ASN.mmdb"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: collector-api
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - geoip_data:/etc/geoip
    environment:
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "collector_db"
      API_LISTEN_ADDR: "0.0.0.0:8080"
      LOCAL_ASN: "45287"
    restart: unless-stopped

volumes:
  clickhouse_data:
  geoip_data:
